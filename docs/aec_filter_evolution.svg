<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif">
  <defs>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#475569"/>
    </marker>
    <marker id="arrG" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto">
      <path d="M0,0 L0,8 L10,4 z" fill="#059669"/>
    </marker>
    <linearGradient id="winnerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <style>
      .title    { font-size: 22px; font-weight: 800; fill: #1e293b; }
      .subtitle { font-size: 13px; fill: #64748b; font-style: italic; }

      .add-label { font-size: 12.5px; font-weight: 800; fill: #1e293b; }
      .add-why   { font-size: 11px; fill: #64748b; }
      .add-label-w { font-size: 12.5px; font-weight: 800; fill: #047857; }
      .add-why-w   { font-size: 11px; fill: #059669; }

      .box-name { font-size: 18px; font-weight: 800; fill: #fff; }
      .box-tag  { font-size: 11px; fill: rgba(255,255,255,.85); }
      .box-line { font-size: 11.5px; fill: rgba(255,255,255,.92); }

      .winner-tag { font-size: 11px; font-weight: 800; fill: #fff; }

      .row-label { font-size: 12px; font-weight: 700; fill: #1e293b; }
      .cell      { font-size: 11.5px; fill: #334155; }
      .cell-best { font-size: 11.5px; fill: #065f46; font-weight: 700; }
    </style>
  </defs>

  <!-- ───── Title ───── -->
  <text x="620" y="36" text-anchor="middle" class="title">Linear Adaptive Filter 演進 — 為什麼最後選 PBFDKF</text>
  <text x="620" y="58" text-anchor="middle" class="subtitle">每一代修上一代的弱點，最後落在 PBFDKF</text>

  <!-- ───── Top arrow-label band (ABOVE boxes, no overlap) ───── -->
  <!-- Between LMS and NLMS -->
  <text x="248" y="92"  text-anchor="middle" class="add-label">+ 自動 normalize</text>
  <text x="248" y="108" text-anchor="middle" class="add-why">解：μ 對音量太敏感</text>

  <!-- Between NLMS and FDAF -->
  <text x="488" y="92"  text-anchor="middle" class="add-label">+ 上頻域</text>
  <text x="488" y="108" text-anchor="middle" class="add-why">解：時域逐 sample 太慢</text>

  <!-- Between FDAF and PBFDAF -->
  <text x="728" y="92"  text-anchor="middle" class="add-label">+ 分區塊 (partition)</text>
  <text x="728" y="108" text-anchor="middle" class="add-why">解：filter 長度被 block 限制</text>

  <!-- Between PBFDAF and PBFDKF (winner color) -->
  <text x="968" y="92"  text-anchor="middle" class="add-label-w">+ Kalman 自動油門</text>
  <text x="968" y="108" text-anchor="middle" class="add-why-w">解：μ 仍要手動調</text>

  <!-- ───── 5 boxes (moved DOWN to avoid overlap with arrow labels) ───── -->
  <!-- Box 1: LMS -->
  <rect x="30"  y="130" width="195" height="120" rx="12" fill="#94a3b8"/>
  <text x="127" y="158" text-anchor="middle" class="box-name">LMS</text>
  <text x="127" y="176" text-anchor="middle" class="box-tag">時域 · 逐 sample</text>
  <line x1="50"  y1="186" x2="205" y2="186" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <text x="127" y="206" text-anchor="middle" class="box-line">最樸素的學習法</text>
  <text x="127" y="224" text-anchor="middle" class="box-line">w += μ · e · x</text>
  <text x="127" y="242" text-anchor="middle" class="box-line">1960s</text>

  <!-- Box 2: NLMS -->
  <rect x="270" y="130" width="195" height="120" rx="12" fill="#64748b"/>
  <text x="367" y="158" text-anchor="middle" class="box-name">NLMS</text>
  <text x="367" y="176" text-anchor="middle" class="box-tag">時域 · 逐 sample</text>
  <line x1="290" y1="186" x2="445" y2="186" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <text x="367" y="206" text-anchor="middle" class="box-line">遠端音量自動補償</text>
  <text x="367" y="224" text-anchor="middle" class="box-line">μ ÷ ‖x‖² normalize</text>
  <text x="367" y="242" text-anchor="middle" class="box-line">1970s</text>

  <!-- Box 3: FDAF -->
  <rect x="510" y="130" width="195" height="120" rx="12" fill="#3b82f6"/>
  <text x="607" y="158" text-anchor="middle" class="box-name">FDAF</text>
  <text x="607" y="176" text-anchor="middle" class="box-tag">頻域 · 整塊 FFT</text>
  <line x1="530" y1="186" x2="685" y2="186" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <text x="607" y="206" text-anchor="middle" class="box-line">頻域並行學習</text>
  <text x="607" y="224" text-anchor="middle" class="box-line">每個 freq bin 各自更新</text>
  <text x="607" y="242" text-anchor="middle" class="box-line">1980s</text>

  <!-- Box 4: PBFDAF -->
  <rect x="750" y="130" width="195" height="120" rx="12" fill="#1d4ed8"/>
  <text x="847" y="158" text-anchor="middle" class="box-name">PBFDAF</text>
  <text x="847" y="176" text-anchor="middle" class="box-tag">頻域 · 分區塊 (P partitions)</text>
  <line x1="770" y1="186" x2="925" y2="186" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <text x="847" y="206" text-anchor="middle" class="box-line">處理長 echo path</text>
  <text x="847" y="224" text-anchor="middle" class="box-line">分 6 段 → 60 ms 覆蓋</text>
  <text x="847" y="242" text-anchor="middle" class="box-line">1990s</text>

  <!-- Box 5: PBFDKF (winner) -->
  <rect x="990" y="122" width="220" height="136" rx="12" fill="url(#winnerGrad)" stroke="#fbbf24" stroke-width="3"/>
  <text x="1100" y="150" text-anchor="middle" class="box-name">PBFDKF</text>
  <text x="1100" y="170" text-anchor="middle" class="box-tag">頻域 · 分區塊 + Kalman gain</text>
  <line x1="1010" y1="180" x2="1190" y2="180" stroke="rgba(255,255,255,.4)" stroke-width="1"/>
  <text x="1100" y="200" text-anchor="middle" class="box-line" font-weight="700">自動 step size</text>
  <text x="1100" y="218" text-anchor="middle" class="box-line">每 bin 用 K = P/(P + R·|X|²)</text>
  <text x="1100" y="236" text-anchor="middle" class="box-line">2010s — production</text>
  <rect x="1010" y="244" width="180" height="14" rx="3" fill="rgba(255,255,255,.22)"/>
  <text x="1100" y="255" text-anchor="middle" class="winner-tag">OUR CHOICE</text>

  <!-- ───── Arrow lines (between boxes, in the gap, at box mid-height) ───── -->
  <line x1="225" y1="190" x2="267" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="465" y1="190" x2="507" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="705" y1="190" x2="747" y2="190" stroke="#475569" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="945" y1="190" x2="987" y2="190" stroke="#059669" stroke-width="3"   marker-end="url(#arrG)"/>

  <!-- ───── Capability comparison table ───── -->
  <text x="30" y="300" class="row-label">關鍵能力對照</text>

  <g transform="translate(30,315)">
    <!-- Header row -->
    <rect x="0"    y="0" width="180" height="32" fill="#1e293b"/>
    <text x="90"   y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">能力</text>

    <rect x="180"  y="0" width="195" height="32" fill="#94a3b8"/>
    <text x="277"  y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">LMS</text>

    <rect x="375"  y="0" width="195" height="32" fill="#64748b"/>
    <text x="472"  y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">NLMS</text>

    <rect x="570"  y="0" width="195" height="32" fill="#3b82f6"/>
    <text x="667"  y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">FDAF</text>

    <rect x="765"  y="0" width="195" height="32" fill="#1d4ed8"/>
    <text x="862"  y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">PBFDAF</text>

    <rect x="960"  y="0" width="220" height="32" fill="url(#winnerGrad)"/>
    <text x="1070" y="22" text-anchor="middle" font-size="13" fill="#fff" font-weight="700">PBFDKF (Our Choice)</text>

    <!-- Row: 收斂速度 -->
    <rect x="0"   y="32" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="53" class="cell" font-weight="700">收斂速度</text>
    <rect x="180" y="32" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="53" text-anchor="middle" class="cell">慢 (秒級)</text>
    <rect x="375" y="32" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="53" text-anchor="middle" class="cell">中</text>
    <rect x="570" y="32" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="53" text-anchor="middle" class="cell">較快</text>
    <rect x="765" y="32" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="53" text-anchor="middle" class="cell">快</text>
    <rect x="960" y="32" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="53" text-anchor="middle" class="cell-best">最快</text>

    <!-- Row: 長 echo -->
    <rect x="0"   y="64" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="85" class="cell" font-weight="700">長 echo (RT60 &gt; 30 ms)</text>
    <rect x="180" y="64" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="85" text-anchor="middle" class="cell">做不到</text>
    <rect x="375" y="64" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="85" text-anchor="middle" class="cell">做不到</text>
    <rect x="570" y="64" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="85" text-anchor="middle" class="cell">受限 block size</text>
    <rect x="765" y="64" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="85" text-anchor="middle" class="cell">通過 (60 ms)</text>
    <rect x="960" y="64" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="85" text-anchor="middle" class="cell-best">通過 (60 ms)</text>

    <!-- Row: μ 不用手調 -->
    <rect x="0"   y="96" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="117" class="cell" font-weight="700">μ 不用人工調</text>
    <rect x="180" y="96" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="117" text-anchor="middle" class="cell">每裝置都要 tune</text>
    <rect x="375" y="96" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="117" text-anchor="middle" class="cell">仍要 tune</text>
    <rect x="570" y="96" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="117" text-anchor="middle" class="cell">仍要 tune</text>
    <rect x="765" y="96" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="117" text-anchor="middle" class="cell">仍要 tune</text>
    <rect x="960" y="96" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="117" text-anchor="middle" class="cell-best">Kalman 自動算</text>

    <!-- Row: 移動 / EPC 恢復 -->
    <rect x="0"   y="128" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="149" class="cell" font-weight="700">移動 / EPC 恢復</text>
    <rect x="180" y="128" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="149" text-anchor="middle" class="cell">1–3 秒</text>
    <rect x="375" y="128" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="149" text-anchor="middle" class="cell">1–2 秒</text>
    <rect x="570" y="128" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="149" text-anchor="middle" class="cell">~1 秒</text>
    <rect x="765" y="128" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="149" text-anchor="middle" class="cell">~500 ms</text>
    <rect x="960" y="128" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="149" text-anchor="middle" class="cell-best">~200 ms</text>

    <!-- Row: DT 自動保護 -->
    <rect x="0"   y="160" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="181" class="cell" font-weight="700">DT 自動保護</text>
    <rect x="180" y="160" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="181" text-anchor="middle" class="cell">一講話就學壞</text>
    <rect x="375" y="160" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="181" text-anchor="middle" class="cell">需配強 DTD</text>
    <rect x="570" y="160" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="181" text-anchor="middle" class="cell">需配強 DTD</text>
    <rect x="765" y="160" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="181" text-anchor="middle" class="cell">需配強 DTD</text>
    <rect x="960" y="160" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="181" text-anchor="middle" class="cell-best">Kalman 自動降速</text>

    <!-- Row: 算力 (相對) -->
    <rect x="0"   y="192" width="180" height="32" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="14"  y="213" class="cell" font-weight="700">算力 (相對於 LMS)</text>
    <rect x="180" y="192" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="277" y="213" text-anchor="middle" class="cell">1×</text>
    <rect x="375" y="192" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="472" y="213" text-anchor="middle" class="cell">1.1×</text>
    <rect x="570" y="192" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="667" y="213" text-anchor="middle" class="cell">2.5×</text>
    <rect x="765" y="192" width="195" height="32" fill="#fff" stroke="#e2e8f0"/>
    <text x="862" y="213" text-anchor="middle" class="cell">4×</text>
    <rect x="960" y="192" width="220" height="32" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="1070" y="213" text-anchor="middle" class="cell-best">5× (現代 ARM 完全跑得動)</text>
  </g>

  <!-- ───── Footer takeaway bar ───── -->
  <rect x="30" y="568" width="1180" height="40" rx="8" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <text x="620" y="594" text-anchor="middle" font-size="13" fill="#78350f" font-weight="700">
    PBFDKF 把「步長 μ 該設多少」這個 30 年來最痛的人工旋鈕交給 Kalman 自動算 — 跨裝置不用重 tune，EPC 後 200 ms 恢復，DT 自動保護
  </text>
</svg>
